name: Build iOS App (Echo: The Scrappy-Bot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify Swift & C++20 Toolchain
        run: |
          swift --version
          clang++ --version

      - name: Build Swift Package & Native Libraries
        working-directory: ios
        run: |
          swift build -c release

      - name: Create Unsigned Payload & IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          # Package ready for distribution / AltStore / Sideloading
          echo "Build completed successfully with C++20 and Swift 5.9!"

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo_The_Scrappy_Bot_iOS
          path: ios/
